name: proyek_ruangles
description: Aplikasi Ruang Les - Frontend

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  device_preview: ^1.3.1
  
  # ===== FIREBASE PACKAGES =====
  # Core Firebase (wajib)
  firebase_core: ^2.24.2
  
  # Fitur yang dibutuhkan aplikasi Ruang Les:
  firebase_auth: ^4.16.1        # Untuk login anak/orangtua/pengajar
  cloud_firestore: ^4.15.3      # Untuk database (game score, materi, dll)
  firebase_storage: ^11.4.1     # Untuk upload file materi & avatar
  firebase_messaging: ^14.7.1   # Untuk push notification pembayaran
  
  # Optional (tapi recommended):
  firebase_analytics: ^10.7.1   # Untuk tracking aktivitas anak
  firebase_crashlytics: ^3.3.1  # Untuk error reporting
  provider: ^6.1.5+1
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/gambar/
    - assets/images/      # Tambah folder untuk gambar game
    - assets/sounds/      # Untuk suara game (opsional)